[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditrisk"
version = "1.0.0"
description = "Out-of-time validated probability-of-default model on Lending Club loans: WoE scorecard vs LightGBM, calibration, profit-based cutoff and drift monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhruv Kashyap" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "duckdb>=1.0",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.6", "streamlit>=1.40"]

[project.scripts]
creditrisk = "creditrisk.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905"]  # zip(strict=...) adds noise here; inputs are built together
